aid: rcs-capital
name: RCS Capital
description: >-
  RCS Capital Corporation (RCAP) was a publicly traded holding company focused
  on the financial services industry, founded by Nicholas Schorsch and taken
  public in June 2013. The firm owned a diversified group of businesses including
  independent broker-dealers, investment banking, capital markets, and transaction
  management services. It assembled Cetera Financial Group to become the second
  largest network of independent broker-dealers in the United States, with
  approximately 9,100 financial advisors managing $220 billion in assets under
  administration for 2.5 million clients. RCS Capital filed for Chapter 11
  bankruptcy protection in January 2016, citing $1.39 billion in debts, and
  emerged in May 2016 as Aretec Group, Inc., the holding company of Cetera
  Financial Group. No public developer APIs were offered under the RCS Capital brand.
